name: CI / Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.14'
  AGP_VERSION: '8.11.0'
  COMPILE_SDK: '35'
  BUILD_TOOLS_VERSION: '35.0.0'

jobs:
  # ---------------------------------------------------------------- Android
  android-agent:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.COMPILE_SDK }}

      - name: Set ANDROID_HOME
        run: echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Assemble debug APK
        run: |
          cd android-agent
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-agent-debug
          path: android-agent/build/outputs/apk/debug/
          retention-days: 30

      - name: Assemble release APK
        if: github.event_name == 'push'
        run: |
          cd android-agent
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: android-agent-release
          path: android-agent/build/outputs/apk/release/
          retention-days: 90

  # ------------------------------------------------------------- Desktop
  desktop-controller:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build desktop controller
        run: |
          cd desktop-controller
          ./gradlew build --no-daemon --stacktrace

      - name: Create desktop zip
        run: |
          cd desktop-controller/build/libs
          mkdir -p ../../../dist/desktop-controller
          cp *.jar ../../../dist/desktop-controller/
          cd ../../../dist/desktop-controller
          zip -r ../remote-control-desktop-linux.zip .
          cd ../..
          echo "desktop-controller-linux" > dist/.platform

      - name: Upload desktop build
        uses: actions/upload-artifact@v4
        with:
          name: desktop-controller-linux
          path: dist/desktop-controller-linux.zip
          retention-days: 90

  # ------------------------------------------------------------- Server
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd server
          pip install -r requirements.txt
          pip install pytest pytest-asyncio websockets

      - name: Run smoke tests
        run: |
          cd server
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 &
          sleep 3
          python smoke_test.py

      - name: Lint Python
        run: |
          cd server
          pip install flake8
          flake8 main.py hub.py models.py smoke_test.py --max-line-length=120 --statistics

  # ------------------------------------------------------------- Release
  create-release:
    needs: [android-agent, desktop-controller, server-tests]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android release APK
        uses: actions/download-artifact@v4
        with:
          name: android-agent-release
          path: release-artifacts/android

      - name: Download desktop build
        uses: actions/download-artifact@v4
        with:
          name: desktop-controller-linux
          path: release-artifacts/desktop

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-${{ github.run_number }}
          name: Remote Control v0.1.0 (${{ github.run_number }})
          body: |
            ## Remote Control v0.1.0

            Cross-device remote control for Android phones.

            ### Downloads

            - **Android Agent (APK)** — install on your phone
            - **Desktop Controller (Linux)** — run on your desktop

            ### Getting started

            1. Install the APK on your phone.
            2. Start the hub server on your computer.
            3. Run the desktop app, enter the 6-digit code from your phone, and accept.
          draft: false
          prerelease: false
          files: |
            release-artifacts/android/*.apk
            release-artifacts/desktop/*.zip
