name: CI / Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.14'
  AGP_VERSION: '8.11.0'
  COMPILE_SDK: '35'

jobs:
  # ---------------------------------------------------------------- Android
  android-agent:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        run: |
          # GitHub ubuntu-latest runners have Android SDK pre-installed at $ANDROID_HOME.
          # Accept licenses and install the target platform (non-fatal: Gradle will download missing pieces).
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-${{ env.COMPILE_SDK }}" >/dev/null 2>&1 || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew :android-agent:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-agent-debug
          path: android-agent/build/outputs/apk/debug/
          retention-days: 30

      - name: Assemble release APK
        if: github.event_name == 'push'
        run: ./gradlew :android-agent:assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: android-agent-release
          path: android-agent/build/outputs/apk/release/
          retention-days: 90

  # ------------------------------------------------------------- Desktop
  desktop-controller:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build desktop controller
        run: ./gradlew :desktop-controller:fatJar --no-daemon --stacktrace

      - name: Stage desktop artifact
        run: |
          mkdir -p dist
          cp desktop-controller/build/libs/remote-control-desktop.jar dist/

      - name: Upload desktop build
        uses: actions/upload-artifact@v4
        with:
          name: desktop-controller
          path: dist/remote-control-desktop.jar
          retention-days: 90

  # ------------------------------------------------------------- Desktop (Windows installer)
  desktop-windows:
    runs-on: windows-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build desktop fat jar
        run: ./gradlew :desktop-controller:fatJar --no-daemon --stacktrace

      - name: Create Windows installer
        shell: pwsh
        run: |
          $jdk = $env:JAVA_HOME
          & "$jdk\bin\jpackage.exe" --input desktop-controller\build\libs --name "RemoteControl" --main-jar remote-control-desktop.jar --main-class com.remotectl.desktop.MainKt --type exe --dest dist --win-dir-chooser --win-menu --win-shortcut --app-version "0.1.0"
          $exe = Get-ChildItem dist\*.exe | Select-Object -First 1
          Copy-Item $exe.FullName dist\remote-control-desktop.exe

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-controller-windows
          path: dist/remote-control-desktop.exe
          retention-days: 90
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd server
          pip install -r requirements.txt
          pip install pytest pytest-asyncio websockets

      - name: Run smoke tests
        run: |
          cd server
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 &
          sleep 3
          python smoke_test.py

      - name: Lint Python
        run: |
          cd server
          pip install flake8
          flake8 main.py hub.py models.py smoke_test.py --max-line-length=120 --statistics || true

  # ------------------------------------------------------------- Release
  create-release:
    needs: [android-agent, desktop-controller, desktop-windows, server-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android release APK
        uses: actions/download-artifact@v4
        with:
          name: android-agent-release
          path: release-artifacts/android

      - name: Download desktop build
        uses: actions/download-artifact@v4
        with:
          name: desktop-controller
          path: release-artifacts/desktop

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: desktop-controller-windows
          path: release-artifacts/desktop

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-${{ github.run_number }}
          name: Remote Control v0.1.0 (${{ github.run_number }})
          body: |
            ## Remote Control v0.1.0

            Cross-device remote control for Android phones.

            ### Downloads

            - **Android Agent (APK)** — install on your phone
            - **Desktop Controller (Linux)** — run on your desktop

            ### Getting started

            1. Install the APK on your phone.
            2. Start the hub server on your computer.
            3. Run the desktop app, enter the 6-digit code from your phone, and accept.
          draft: false
          prerelease: false
          files: |
            release-artifacts/android/*.apk
            release-artifacts/desktop/*
